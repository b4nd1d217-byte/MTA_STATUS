services:
  - type: web
    name: mta-status-manager-va
    runtime: node
    region: virginia
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        fromService:
          name: mta-status-manager-sj6o
          type: web
          envVarKey: DISCORD_TOKEN
      - key: API_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mta-status-manager-db
          property: connectionString
      - key: PGSSL
        value: "false"

databases:
  - name: mta-status-manager-db
    databaseName: mta_status_manager_db
    user: mta_status_manager_db_user
    region: virginia
    plan: free
    postgresMajorVersion: 18
